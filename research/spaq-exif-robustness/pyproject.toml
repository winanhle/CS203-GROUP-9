[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spaq-exif-robustness"
version = "0.0.0"
description = "Controlled study of EXIF metadata for smartphone image quality assessment"
requires-python = ">=3.11,<3.14"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]
analysis = ["matplotlib>=3.11,<4", "pandas>=2.3,<4", "pyarrow>=21,<24", "scipy>=1.16,<2"]
iqa = ["pyiqa==0.1.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

